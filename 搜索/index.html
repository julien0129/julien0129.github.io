<span class=theme-icon>🌓</span></button></nav></div></header><main class=container id=siteMain><section class="section search-section"><div class=section-head><h1 class=section-title>搜索</h1></div><input type=search id=searchInput class=search-input placeholder=输入关键词，搜索日记… autocomplete=off><ul id=searchResults class=search-results></ul><p id=searchEmpty class=search-empty hidden>没有找到相关日记。</p></section><script id=searchData type=application/json>[{"date":"2026.11.23","text":"千禧人生随想\r我个人非常喜欢Frutiger Aero的美学风格，它有一个十分贴切的总结：“我们曾被许诺的未来”。\n好吧，打下这段字的时候有一种挺怪的感觉，或许是因为今年以来这个Frutiger Aero的tag从以前的小众爱好圈已经开始变得有些知名度了，抖音上都有挺多动辄10万+点赞的视频，这或许让这些文字给人一种我在追逐潮流的感觉。嗯！其实我算是关注得很早的了。\n但是我认为这是很合理的，Frutiger Aero必然会在国内火起来，因为它实在是太符合我们这一代人的怀旧念想了。\n我们曾被许诺过的未来。\n从整个群体的宏大角度上来说，我们这一代人的童年算是彻底地和中国曾经所有代人的童年区分开来——第一代见识到全球化的中国孩子们。但戏剧化就在此：全球化开始退潮了。保守主义抬头，逆全球化开始兴起。很多人常说，中国的千禧一代，形如日本在泡沫经济时代成长的那一代人。\n这些观点和讨论，网路上已经有很多了。我在这里随想的是我们这一代的人生之路。\n现在是2026年，千禧一代都已经进入了社会，大部分人也意识到现在和10年前的天差地别，曾经长辈进入社会时处处是机遇的时代已经过去了，我们面临的是一个存量社会。\n我的幸运是，我不会进入享福tv，背上沉重的房贷和车贷。这是一个很大的优势。（代价是我在未来几乎肯定会花费大量精力处理家庭关系）\n不过老实说，在存钱这块，我确实不太热衷。我的观念是能存则存，想消费的时候一定要痛痛快快的消费（哎，多一点我这种观点的人何愁内需不振）。\n我有一首非常喜欢的歌，来自Alanis Morissette的《ironic》，哪怕再完美的人生，都有可能被一些突如其来的事情彻底打乱。\n我的想法很简单：最珍贵的回忆一定来自年轻的时候，你在年轻时的外出旅行经历会成为未来几十年的精神食粮。与其垂垂老矣的时候才病怏怏地去这辈子都想去的地方，我干嘛不有力气的时候去？\n当然，也不是说完全不攒钱，这也是我现在有些苦恼的地方，我觉得我攒钱效率有些低。\n不过仔细想其实也是没办法的事呀\u0026hellip;\u0026hellip;太多想改变的地方了：我想做眼睛手术要接近2万元、我想练篮球一个半月就要1800元、我想健身一个月也要不知道多少钱。\n写到这里，我觉得我确实有必要做一个记账的小东西了🤔\n刚好在这里说回到正题，我们这一代的人生道路——我的看法是：积蓄力量。\n和之前说的一样，现在，甚至可预见的未来几年，整个社会仍在存量时间，机遇极少（对我们这些普通人而言），AI是否会成为当年互联网一样的第五次工业革命（或者叫第二次信息革命？）没人能打包票。\n但有一点我倒是觉得是一定的：不可能一直下行，有生之年一定会上行。我们要等的就是那个时候。\n好吧，其实说了这么半天，似乎得到的是一个谁都看得出来的结论，更多的是自己的碎碎念。\n这么看来其实更多的是自己的纠结：我得积蓄力量，但是我积蓄力量的能力太小了。\n如何改变呢？嗯，目前我认为有3条路：\n💰副职创造收入（困难点：完全没有头绪）\n💼职场努力升职加薪（困难点：感觉并没有做好准备开始加班开卷）\n🧑‍🤝‍🧑找个男朋友，两人攒钱一定比一个人快得多（困难点：很难在三线城市找到合我心意的对象）\n目前最可行的是第二个，但是感觉会很累。光是学业上，由于我目前只是本科，我需要开始备考在职研究生，又一次开始学业上的拼搏（这在我的大学6年之后让我有一些心理阴影），更别提工作上。\n我得好好想一想，呃，但别太久。\n","title":"千禧人生随想","url":"/p/%E5%8D%83%E7%A6%A7%E4%BA%BA%E7%94%9F%E9%9A%8F%E6%83%B3/"},{"date":"2025.12.20","text":"我的第一篇博客\rIf I had my chance\nWould I risk it all\nWould I dare to leave\nEverything behind me\nFloating Futures feat. Lady Paradox \u0026amp; yu-ri (BLU-SWING)，歌手名：Re:Plus (リ:プラス)/Lady Paradox/Yu-ri\n​\t当我敲下键盘的时候，我正听到这首歌，调子非常old school，让我联想到2016年之前。\n​\t我想，在我目前24岁（即将25岁）的生命里，如果要划分一些重要的时间节点的话，那么应该是2013年、2016年，以及2020年。\n​\t2016年是一个很神奇的年份，我刚刚初中毕业，进入了高中。我总觉得，在2016年之前我以及我身边的人都是悠闲的，而从此之后，大家都开始忙碌了起来。对个人而言，再也没有完整的双休周末可以在我家那台破破烂烂的Windows XP系统的电脑上玩游戏的时间；对身边的人而言，我总感觉从那一年开始，街边大大小小的茶馆子开始逐渐凋敝了。而且，我在初中的时候，感觉我并没有花非常大的力气在学业上，但是成绩也算拿得出手，因此，我很怀念2016年之前。\n​\t我高中在全市最好的中学就读，大家都很优秀，我就开始吃力了起来。我发现我无论如何努力，也没办法让成绩变得出众，更让人无奈的是甚至经常倒退，不过我感觉我似乎依然没什么压力——我的意思是，基本没有特别地因此闷闷不乐过。另外，我的高中也是我结交最多朋友的日子，噢，还有第一次情窦初开的日子。哈，现在想到当初那么喜欢那个男生，为他做的种种丑事就忍俊不禁。总的来说我的高中虽然辛苦，但是也算是开心顺遂。\n​\t或许正是抱着这样的好心态，我的高考发挥非常好，甚至可以说非常吓人地好。我平常的模拟考试成绩能上一所普通的一本学校，我高考时也是抱着这样的目标的，但是我考上了一所985大学。我至今都还记得考完的那天晚上，我没有参加任何同学的聚餐，躲到了一间外表看起来简陋不堪，但是进去之后发现其实配置还不赖的网吧（我偶然发现这个地方之后，将它作为我的避风港，不过现在它已经没有再营业了）里玩守望先锋。我的哥哥这时候找了过来拉着我去吃饭，问我想吃什么，我说麦当劳，于是我们就打车去了麦当劳，路上他鼓动我对着答案，我就对了起来，对完之后我就知道我考了一个非常让人开心的分数。\n​\t真是非常开心的三个月暑期。\n​\t再然后就是大学了。\n​\t很遗憾，我的大学过得非常不好，或许是进入了不属于我的层次的缘故，我的学业非常吃力，再加上2020年初到2023年初的可怖的三年疫情时期，我的四年本科学业，用了6年才完成。\n​\t6年，占据我现在人生1/4的时间，这份十足的压抑岁月彻底改变了我，重塑了我。一次又一次的想要从泥泞里挣扎爬出来的失败尝试让我现在变得畏手畏脚；几任室友都不太能够和我和谐相处让我变得开始怀疑自己的社交技能，以及开始变得非常敏感\u0026hellip;\u0026hellip;这不是很好的习惯。当然，也有些好的：这6年的时间让我变得谨言慎行，我变得非常能够审视自我，这在现在的大环境下应该能够助我良多。\n​\t总之，在我今年6月的本科答辩完成之后，我迷迷糊糊地收拾好一切，坐上汽车离开这个让我伤心的大城市的时候，我看着艳阳灿灿的天空，还有些发懵，总算摆脱这让人痛苦的日子了啊。\n​\t现在我在一家家乡的国企工作，也算是得了家庭的荫蔽。不过这其实不是我的本意。我这样的群体，一切顺利的话，在大城市里工作→经济独立→come out，这才是我最初的想法。不过这6年彻底改变了我的人生，也只好先龟缩起来。\n​\t多余的，我现在总是不想再谈，我总是倾向于彻底埋葬那段难堪的岁月。毕竟无论如何，都已经过去了。\n​\t现在，我开始写下我的生活，在这里。我希望未来的我在得闲回顾这些日记的时候，能够从中再次体会到当时我的思绪和情感波动，我想这就是我建立这个赛博日记站的主要目标。\n​\tJulien\n2025/12/20 17:06\n​\n​\n​\n","title":"我的第一篇博客","url":"/p/%E6%88%91%E7%9A%84%E7%AC%AC%E4%B8%80%E7%AF%87%E5%8D%9A%E5%AE%A2/"}]</script></main><footer class=site-footer><div class=footer-inner><p class=footer-meta>© 2025 Julien · Built with Hugo</p><p cla
